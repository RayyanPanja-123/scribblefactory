# Only for writing new migrations: `.venv/Scripts/alembic revision --autogenerate -m "what changed"`.
# The app migrates by itself (pipeline/scribble/db.py) on every library's first open.
[alembic]
script_location = pipeline/scribble/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///library/database/scribble.db
